services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartrot
      POSTGRES_PASSWORD: smartrot
      POSTGRES_DB: smartrot
    ports:
      - "5432:5432"
    volumes:
      - smart-rot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart-rot-postgres:
